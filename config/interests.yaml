  educacion_programacion:
    descripcion: Educación de programación; revisar las políticas antes de contribuir
    repos_semilla:
      - freeCodeCamp/freeCodeCamp  # Solo seguimiento: el proyecto prohíbe aportes con IA

  ecosistema_eddumelendez:
    descripcion: >
      Proyectos donde contribuye Eddú Meléndez (eddumelendez, Java Champion,
      maintainer de Testcontainers Java, amigo del usuario). Señal social:
      review probable por alguien de confianza. Prioridad alta en Java.
    repos_semilla:
      - testcontainers/testcontainers-java   # él es maintainer; 7 GFI + 21 help-wanted (2026-07-17)
      - spring-io/start.spring.io
      - spring-projects/spring-ai            # 7 help-wanted; caliente
      - 1Password/shell-plugins              # Go, plugins por template, merge rápido
      # Repos donde eddu CONTRIBUYE (no maintainer) con buena comunidad — señal
      # de comunidad sana, no de review garantizado (2026-07-20):
      - docker-java/docker-java              # Java 3190★; PAUSADO 2026-09-02: sin PR humano mergeado desde 2025-07, 104 PRs abiertos, solo pushes de dependabot (reports/2026-09-02-scan.md)
      - spring-io/initializr                 # Java 3696★; eddu 1 PR; sin labels de entrada
      - openrewrite/rewrite-testing-frameworks # Java 99★; muy activo; recetas de migración de tests

