# Observar no implica poder enviar código con agentes. Revalidar siempre la
# política vigente; estos límites se detectaron el 2026-10-12.
restricciones_contribucion:
  torchgeo/torchgeo: Solo seguimiento y trabajo local hasta aclarar la política local No LLMs
  freeCodeCamp/freeCodeCamp: Solo seguimiento; contribuciones con IA prohibidas
  fatiando/harmonica: Aportes futuros principalmente escritos por humanos; PRs previos pendientes de decisión
  fatiando/boule: Aportes futuros principalmente escritos por humanos
  lichess-org/lila: Disclosure obligatorio, revisión y pruebas humanas antes de marcar un PR ready
  open-telemetry/opentelemetry-python-contrib: Código asistido permitido; comunicación humana según AGENTS.md

# Contribuciones de cursos/comunidad y PRs antiguos; no son la cartera habitual.
repos_historicos:
  - EscuelaIt/Curso-de-Django-Rest-Framework
  - EscuelaIt/curso-django
  - pythonpe/python.pe
  - diptangsu/Data-Structures
  - hackspaceperu/Serverless-Training

lenguajes_preferidos: [Python, Java, C++, Go, Rust]

criterios:
  # Un repo se considera "vivo" si tuvo push en este período
  actividad_maxima_dias: 90
  estrellas_minimas: 50          # dominios de nicho (geociencias/minería) pueden bajar de esto
  etiquetas_contribucion:
    - good first issue
    - good-first-issue
    - help wanted
    - easy
    - beginner friendly
    - first-timers-only
  senales_buena_comunidad:
    - CONTRIBUTING.md presente
    - issues respondidos por mantenedores en < 14 días
    - PRs de externos mergeados recientemente
  incentivos:  # señales que suben la prioridad de un repo (pedido 2026-07-14)
    - paga bounties por issue (Algora, Polar.sh o propio)
    - empresa con historial de contratar contribuidores de su comunidad
    - protocolo de PR directo sin asignación previa (feedback garantizado vía review)
