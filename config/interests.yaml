# Perfil de intereses para el escaneo de proyectos open source.
# Los agentes leen este archivo para saber qué buscar y cómo priorizar.
# Edita libremente: agrega dominios, repos semilla o ajusta criterios.

perfil:
  usuario_github: manduinca
  contexto: >
    Deep Skill trabaja en ciencias de la tierra (geología, geoestadística,
    geofísica), optimización en minería y procesamiento de imágenes.
    Interés en contribuir a librerías del ecosistema Python, Java, Go y Rust.
    Proyectos internos de la org deep-skill (señal de rubros concretos):
    seismic-hazard-simulator, mineral-resource-estimator, haul-sight,
    borehole-drill, stockpiling-simulation-transport.

dominios:
  geociencias:
    descripcion: Geología, geoestadística, geofísica, sísmica, geoquímica
    keywords:
      - geology
      - geostatistics
      - geophysics
      - seismic hazard
      - structural geology
      - geochemistry
      - kriging
      - facies classification
    repos_semilla:
      - gempy-project/gempy
      - pyvista/pyvista
      - fatiando/verde
      - fatiando/harmonica
      - fatiando/boule
      - DASDAE/dascore
      - seisbench/seisbench
      - GlacioHack/xdem
      - obspy/obspy
      - GeostatsGuy/GeostatsPy
      - GeoStat-Framework/GSTools
      - Unidata/MetPy               # ciencia atmosférica, Unidata/NumFOCUS; GFI limpios (escaneo 2026-07-15)
      - geopandas/geopandas         # core geoespacial, alto prestigio
      - rasterio/rasterio           # I/O raster geoespacial
      - simpeg/simpeg              # agregado tras escaneo 2026-07-14
      - GenericMappingTools/pygmt  # agregado tras escaneo 2026-07-14
      - OSGeo/gdal                 # C++ geoespacial; paga maintenance work units (RFC 83)

  remunerados:
    descripcion: Repos con bounties activos o escalera contribuidor→empleo (informe 2026-07-14)
    repos_semilla:
      - onyx-dot-app/onyx          # Python RAG; bounties ~$250 vía Algora
      - commaai/openpilot          # Python/C++; bounties $100-$300, bounty→contrato
      - calcom/cal.diy             # TypeScript; bounties Algora $50-$100 (antes calcom/cal.com, renombrado; detectado escaneo 2026-08-03)
      - supabase/supabase          # contratan de comunidad; precedente peruano (PostgREST)

  mineria:
    descripcion: Planeamiento minero, optimización de pit, modelos de bloques
    keywords:
      - mine planning
      - pit optimization
      - block model
      - drillhole
      - borehole
      - mining engineering
      - mineral resource estimation
      - stockpile simulation
      - haul cycle
      - fleet dispatch mining
    repos_semilla:
      # MineFlowCSM/MineFlow descartado en escaneo 2026-07-14: sin push desde 2024-01
      # (también muertos: miningpy, opengeostat/pygslib)
      - Loop3D/LoopStructural
      - polatory/polatory
      - MiraGeoscience/geoh5py
      - simpeg/simpeg

  procesamiento_imagenes:
    descripcion: Visión computacional, segmentación, imágenes científicas
    keywords:
      - image processing
      - image segmentation
      - computer vision
      - microscopy imaging
    repos_semilla:
      - scikit-image/scikit-image
      - opencv/opencv
      - napari/napari
      - torchgeo/torchgeo           # deep learning geoespacial + remote sensing; issues disputados (2026-07-15)

  cloud_native_observabilidad:
    descripcion: >
      Observabilidad y cloud-native (CNCF). Segundo carril además de geociencias:
      el usuario tiene experiencia real en producción (Prometheus, Grafana,
      nginx, Docker). Ruta de reputación hacia empleo remoto backend/ops.
    keywords:
      - opentelemetry instrumentation
      - prometheus exporter
      - observability
    repos_semilla:
      - open-telemetry/opentelemetry-python-contrib  # 36 GFI Python (2026-07-17); CLA EasyCLA
      - open-telemetry/opentelemetry-python
      - dapr/python-sdk
      - dapr/java-sdk                                # 11 GFI Java; encaja con Spring
      - testcontainers/testcontainers-go
      - cloudevents/sdk-python
      - falcosecurity/falcosidekick
      - prometheus/client_java
      - czerwonk/ping_exporter
      - moghtech/komodo
      - kubernetes/website
      - open-telemetry/opentelemetry.io
      - backstage/backstage

  librerias_generales:
    descripcion: Librerías base a las que interesa contribuir
    repos_semilla:
      - python/cpython
      - django/django
      - spring-projects/spring-framework
      - spring-projects/spring-boot
      - pyvista/pyvista
      - OpenAPITools/openapi-generator
      - keycloak/keycloak
      - apache/lucene
      - wailsapp/wails
      - Automattic/harper
      - Lightning-AI/litgpt

  aplicaciones_comunidad:
    descripcion: >
      Aplicaciones abiertas de interés explícito del usuario: ajedrez,
      educación y programación competitiva, ERP y gestión de proyectos.
      Incluye tanto Odoo Community como módulos de la Odoo Community Association.
    keywords:
      - chess server
      - competitive programming
      - open source ERP
      - project management
    repos_semilla:
